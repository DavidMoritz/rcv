<!DOCTYPE html>
<html ng-app="mainApp">
  <head>
    <script src="https://www.gstatic.com/firebasejs/4.8.1/firebase.js"></script>
    <!-- firebase-config.js is gitignored and must define window.HQ_FIREBASE_CONFIG
         with your Firebase project's apiKey, authDomain, databaseURL, projectId,
         storageBucket, and messagingSenderId. -->
    <script src="./firebase-config.js"></script>
    <script>
      // Initialize Firebase using config loaded from firebase-config.js
      firebase.initializeApp(window.HQ_FIREBASE_CONFIG);
    </script>
  <script type="text/javascript"></script></head>
  <body>
    <h1>
      HQ Voting
    </h1>
    <h2>
      Code: <span class="display-code"></span>
    </h2>
    <div class="enter-code">
      <label>Enter Code
        <input id="code-input">
      </label>
      <button type="submit" onclick="startHome()">
        Enter
      </button>
    </div>
    <button onclick="startAdmin()">
      Generate Code
    </button>
    <script src="./vote.js"></script>
  </body>
</html>
