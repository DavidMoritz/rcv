<!DOCTYPE html>
<html style="--rotate:212deg;">
<head>
	<meta charset="UTF-8">
	<meta name="description" content="Wrapping Paper App">
	<link rel="shortcut icon" href="./wrap-favicon.ico" type="image/x-icon">
	<link rel="apple-touch-icon" href="./apple-touch-icon.png">
	<meta name="theme-color" content="#333333">
	<meta name="author" content="Moritz Company">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-touch-fullscreen" content="yes">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0-alpha.6/dist/css/bootstrap.min.css" integrity="sha384-rwoIResjU2yc3z8GV/NPeZWAv56rSmLldC3R/AZzGRnGxQQKnKkoFVhFQhNUwEyJ" crossorigin="anonymous">
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.1.1/dist/jquery.slim.min.js" integrity="sha384-A7FZj7v+d/sdmMqp/nOQwliLvUsJfDHW+k9Omg/a/EheAdgtzNs3hpfag6Ed950n" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/tether@1.4.7/dist/js/tether.min.js" integrity="sha384-CPFFlrdhp9pDDCqRqdTKNZ5oAHsnfnvHGt0CsRIeL5Gc7V/OkP1Y4w8zTxlV3mat" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0-alpha.6/dist/js/bootstrap.min.js" integrity="sha384-vBWWzlZJ8ea9aCX4pEW3rVHjgjt7zpkNpZk+02D9phzyeVkE+jo0ieGizqPLForn" crossorigin="anonymous"></script>
	<title>It's a Wrap!</title>
	<style>
.btn-group-justified {
  display: table;
  width: 100%;
  table-layout: fixed;
  border-collapse: separate; }
  .btn-group-justified .btn,
  .btn-group-justified .btn-group {
    float: none;
    display: table-cell;
    width: 1%; }
    .btn-group-justified .btn .btn,
    .btn-group-justified .btn-group .btn {
      width: 100%; }
    .btn-group-justified .btn .dropdown-menu,
    .btn-group-justified .btn-group .dropdown-menu {
      left: auto; }

h5 {
	padding-top: 15px;
}

:root {
  --height: 100px;
  --length: 100px;
  --depth: 100px;
  --rotate: 212deg;
}

.base,
.base * {
  transform-style: preserve-3d;
}

.base {
  height: var(--height);
  width: var(--length);
  margin: auto;
  position: relative;
  border: solid 1px blue;
  transform: rotate3d(1, 1, 1, var(--rotate));
}

.top {
  height: var(--depth);
  width: 100%;
  bottom: 100%;
  position: absolute;
  background-color: rgba(50, 155, 155, .8);
  transform: translateY(50%) rotateX(90deg);
}

.down {
  height: var(--depth);
  width: 100%;
  top: 100%;
  position: absolute;
  background-color: rgba(155, 50, 155, .8);
  transform: translateY(-50%) rotateX(90deg);
}

.right {
  width: var(--depth);
  height: 100%;
  left: 100%;
  position: absolute;
  background-color: rgba(155, 155, 50, .8);
  transform: translateX(-50%) rotateY(90deg);
}

.left {
  width: var(--depth);
  height: 100%;
  right: 100%;
  position: absolute;
  background-color: rgba(50, 155, 50, .8);
  transform: translateX(50%) rotateY(90deg);
}

.aux {
  width: 100%;
  height: var(--depth);
  position: absolute;
  transform: translateY(-50%) rotateX(-90deg);
}

.front {
  height: var(--height);
  width: 100%;
  top: 100%;
  position: absolute;
  background-color: rgba(155, 50, 50, .8);
  transform: rotateX(90deg);
  transform-origin: center top;
}

.back {
  height: var(--height);
  width: 100%;
  bottom: 100%;
  position: absolute;
  background-color: rgba(50, 50, 155, .8);
  transform: rotateX(-90deg);
  transform-origin: center bottom;
}

input {
  width: 50px;
}

body { background-color:#333;
color: white }
#snow{
	background: none;
	font-family: Androgyne;
	background-image: url('s1.png'), url('s2.png'), url('s3.png');
	height: 100%;
	left: 0;
	position: absolute;
	top: 0;
	width: 100%;
	z-index:1;
	animation: snow 10s linear infinite;
}
@keyframes snow {
  0% {background-position: 0px 0px, 0px 0px, 0px 0px;}
  50% {background-position: 500px 500px, 100px 200px, -100px 150px;}
  100% {background-position: 500px 1000px, 200px 400px, -100px 300px;}
}

.cm,
.cm-unit .inch,
.cm-unit .parse {
  display: none;
}
.cm-unit .cm {
  display: block;
}
.unit:after {
  content: " inches";
}
.cm-unit .unit:after {
  content: " centimeters";
}
.measurements {
  clear: both;
  display: flex;
  justify-content: space-around;
}
h2 {
  float: left;
  margin: 5px 20px;
}
#result {
  font-size: 20px;
  margin: 20px;
  text-align: center;
}
h4 {
	padding-top: 15px;
}
.input-group {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  min-height: 200px;
  width: 125px;
}
.parse {
  font-size: 85%
}
input[type=number] {
  border: 0;
  text-align: center;
  font-size: 17px;
  background-color: transparent;
}
h3 {
  margin: 0;
  text-align: center;
}
.plus, .minus, .radio {
  display: inline-block;
  padding: 6px 12px;
  margin-bottom: 0;
  font-size: 14px;
  font-weight: 400;
  line-height: 1.42857143;
  text-align: center;
  white-space: nowrap;
  vertical-align: middle;
  touch-action: manipulation;
  cursor: pointer;
  user-select: none;
  background-image: none;
  border: 1px solid transparent;
  border-radius: 4px;
}
.radio {
  background-color: rgba(128, 128, 128, 0.29);
  color: #011cff;
}
.plus {
  color: #fff;
  background-color: #65b733;
  border-color: #2ea436;
}
.minus {
  color: #fff;
  background-color: #b75833;
  border-color: #a42e2e;
}
	</style>
</head>
<body>
	<div id="snow" class="container-fluid">
		<h5>Roll Width</h5>
		<div class="btn-group inch btn-group-justified" data-toggle="buttons">
			<label class="btn btn-secondary js-roll col"><input type="radio" name="roll-length" value="24">24 in.</label>
			<label class="btn btn-secondary js-roll col active"><input type="radio" name="roll-length" value="30" checked="">30 in.</label>
			<label class="btn btn-secondary js-roll col"><input type="radio" name="roll-length" value="40">40 in.</label>
		</div>
		<div class="radio-group cm" hidden="">
			<label class="radio"><input type="radio" name="roll-length" value="46">46 cm.</label>
			<label class="radio"><input type="radio" name="roll-length" value="61">61 cm.</label>
			<label class="radio"><input type="radio" name="roll-length" value="76">76 cm.</label>
		</div>
		<h5>Package Dimensions</h5>
		<div class="form-inline">
			<input class="form-control col text-center" type="text" pattern="\d*" step="any" name="height">&nbsp;x&nbsp;
			<input class="form-control col text-center" type="text" pattern="\d*" step="any" name="length">&nbsp;x&nbsp;
			<input class="form-control col text-center" type="text" pattern="\d*" step="any" name="depth">
		</div>
		<div class="row">
			<div class="col text-center">
				<h5>Wrapping</h5>
				<p id="result"></p>
			</div>
			<div class="col text-center">
				<h5>Ribbon</h5>
				<p id="ribbon-result"></p>
			</div>
		</div>
		<div class="holder">
			<div class="base">
				<div class="top"></div>
				<div class="down"></div>
				<div class="right"></div>
				<div class="left"></div>
				<div class="aux">
					<div class="front"></div>
					<div class="back"></div>
				</div>
			</div>
		</div>
		<div class="fixed-bottom p-3">
			<h5>Rotate</h5>
			<div class="btn-group inch btn-group-justified" data-toggle="buttons">
				<label class="btn btn-secondary col rotate-left">Left</label>
				<label class="btn btn-secondary col rotate-stop active">Stop</label>
				<label class="btn btn-secondary col rotate-right">Right</label>
			</div>
		</div>
	</div>
	<script>
class Wrap {
	constructor() {
		const getNumber = (query, check) => {
			const newNum = Number(document.querySelector(`[name=${query}]${check ? ":checked" : ""}`).value);

			if(!check) {
  			document.documentElement.style.setProperty(`--${query}`, `${newNum * 10}px`);
			}

			return newNum
		};

		this.height = getNumber("height");
		this.length = getNumber("length");
		this.depth = getNumber("depth");
		this.roll = getNumber("roll-length", true);
		this.buffer = 1;
	}
	get longest() {
		return Math.max(this.height, this.length, this.depth);
	}
	get shortest() {
		return Math.min(this.height, this.length, this.depth);
	}
	get waist() {
		return 2 * (this.height + this.length + this.depth - this.longest);
	}
	get cape() {
		return this.longest + this.shortest;
	}
	get amount() {
		const maxLength = Math.max(this.cape, this.waist) + this.buffer;
		const minLength = Math.min(this.cape, this.waist) + this.buffer;

		if(maxLength <= this.roll) {
			return minLength;
		} else if (minLength <= this.roll) {
			return maxLength;
		} else if (maxLength / 2 <= this.roll) {
			return minLength * 2 - this.buffer;
		} else {
			return "\"Too large for this roll";
		}
	}
	get ribbon() {
		return Math.min(this.cape, this.waist) + this.buffer + 10;
	}
}

function calculateTotal() {
	const wrap = new Wrap();
	const foot = wrap.amount > 23 ? "feet" : "foot";
	const inch = wrap.amount % 12 === 1 ? "inch" : "inches";
	let result = `<span class="unit">${wrap.amount}"</span>`;

	if(wrap.amount > 12) {
		result += ` <span class="parse"><br>(${parseInt(wrap.amount/12)} ${foot} - ${wrap.amount%12}")</span>`;
	}

	document.querySelector("#result").innerHTML = result;

	const ribFoot = wrap.ribbon > 23 ? "feet" : "foot";
	const ribInch = wrap.ribbon % 12 === 1 ? "inch" : "inches";
	let ribResult = `<span class="unit">${wrap.ribbon}"</span>`;

	if(wrap.ribbon > 12) {
		ribResult += ` <span class="parse"><br>(${parseInt(wrap.ribbon/12)} ${ribFoot} - ${wrap.ribbon%12}")</span>`;
	}

	document.querySelector("#ribbon-result").innerHTML = ribResult;
}

function switchUnits() {
	if(document.body.className === "cm-unit") {
		document.body.className = "";
	} else {
		document.body.className = "cm-unit";
	}
}

function clickButton(e) {
	const attr = e.currentTarget.getAttribute("for");
	const targetClass = e.target.className;
	const input = document.querySelector(`[name=${attr}]`);
	let val = Number(input.value);

	if(targetClass.indexOf("plus") >= 0) {
		val += targetClass.indexOf("double") >= 0 ? 5 : 1;
	} else if(targetClass.indexOf("minus") >= 0) {
		val -= targetClass.indexOf("double") >= 0 ? 5 : 1;
	}

	input.value = Math.max(0, val);
	calculateTotal();
}

function on(event, selector, func) {
	document.querySelectorAll(selector).forEach(el => {
		el.addEventListener(event, func);
	});
}

on("input", "input", calculateTotal);
on("change", "input", calculateTotal);
on("click", ".js-roll", () => {
	setTimeout(calculateTotal, 0);
});
on("click", ".input-group", clickButton);
on("click", ".title", switchUnits);

on("click", ".rotate-right", () => { window.rotateDirection = 1; });
on("click", ".rotate-left", () => { window.rotateDirection = -1; });
on("click", ".rotate-stop", () => { window.rotateDirection = 0; });

window.rotateValue = 212;
window.rotateDirection = 0;

setInterval(() => {
	window.rotateValue += window.rotateDirection;
	document.documentElement.style.setProperty('--rotate', window.rotateValue + 'deg');
}, 30);
	</script>
</body>
</html>
