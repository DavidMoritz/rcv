    <div class="modal" id="transfer-ballot-modal" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
            <h2 class="modal-title">Transfer Ballot: {{transferBallotName}}</h2>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>Username</label>
              <input
                name="transferUsername"
                ng-model="transferUsername"
                class="form-control"
                placeholder="Enter username to transfer to"
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              ng-click="transferBallotSubmit()"
              ng-disabled="!transferUsername"
            >
              Transfer
            </button>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
