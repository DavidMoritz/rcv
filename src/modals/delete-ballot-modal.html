    <div class="modal" id="delete-ballot-modal" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
            <h2 class="modal-title">Delete Ballot: {{deleteBallotName}}</h2>
          </div>
          <div class="modal-body">
            <div class="alert alert-danger">
              <strong>Warning:</strong> This will permanently delete this ballot and all its votes.
              This action cannot be undone.
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-danger"
              ng-click="deleteBallotSubmit()"
            >
              Delete Ballot
            </button>
            <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
          </div>
        </div>
      </div>
    </div>
