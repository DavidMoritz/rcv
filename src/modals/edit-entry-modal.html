<div class="modal" id="edit-entry-modal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
        <h2 class="modal-title">Edit Entry</h2>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Entry Name</label>
          <input
            ng-model="editingEntry.name"
            class="form-control"
            ng-readonly="editBallot && ballot.totalVotes > 0"
          />
          <small ng-show="editBallot && ballot.totalVotes > 0" class="text-muted">
            Delete votes to edit.
          </small>
        </div>
        <div class="form-group">
          <label
            >Image URL
            <small class="text-muted"
              >(must point to an image, e.g. ending with png or jpg)</small
            ></label
          >
          <input
            ng-model="editingEntry.image"
            class="form-control"
            placeholder="https://example.com/image.png"
          />
        </div>
        <div class="form-group">
          <label
            >Hyperlink URL
            <small class="text-muted">(must begin with http:// or https://)</small></label
          >
          <input ng-model="editingEntry.hyperlink" class="form-control" placeholder="https://" />
        </div>
        <div class="form-group">
          <label>Color</label>
          <div>
            <label
              ng-repeat="c in entryColorOptions track by $index"
              style="display: inline-block; margin: 0 3px 3px 0; cursor: pointer"
            >
              <input
                type="radio"
                ng-model="editingEntry.color"
                ng-value="c.value"
                style="display: none"
              />
              <span
                style="display: inline-block; width: 28px; height: 28px; border-radius: 50%"
                ng-style="{'border': '2px solid ' + (editingEntry.color === c.value ? '#333' : '#ccc'), 'background-color': c.value ? '#' + c.value : '#fff'}"
              ></span>
            </label>
          </div>
        </div>
      </div>
      <style>
        #edit-entry-modal .modal-footer::before,
        #edit-entry-modal .modal-footer::after {
          display: none;
        }
      </style>
      <div
        class="modal-footer"
        style="display: flex; justify-content: space-between; align-items: center"
      >
        <div>
          <button
            type="button"
            class="btn btn-danger"
            ng-show="editBallot && !(ballot.totalVotes > 0)"
            ng-click="deleteEntry()"
          >
            Delete
          </button>
        </div>
        <div>
          <button type="button" class="btn btn-primary" ng-click="saveEntry()">Save</button>
          <button type="button" class="btn btn-default" data-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
