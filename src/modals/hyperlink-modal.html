    <div class="modal" id="hyperlink-modal" tabindex="-1" role="dialog">
      <div class="modal-dialog" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-label="Close">
              <span aria-hidden="true">&times;</span>
            </button>
            <h2 class="modal-title">Add Hyperlink URL</h2>
          </div>
          <div class="modal-body">
            <div class="form-group">
              <label>URL must begin with "http://" or "https://"</label>
              <input name="hyperlink" class="form-control" placeholder="https://" />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" ng-click="addHyperlink()">Add</button>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
