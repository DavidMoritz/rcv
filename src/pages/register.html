      <div ng-show="activeLink == 'register'" class="panel panel-default">
        <div class="panel-body">
          <h1>Register</h1>
          <div class="row hidden" ng-hide="user.id">
            <div class="col-sm-6">
              <h2>Google</h2>
              <div class="g-signin2" data-onsuccess="onSignIn"></div>
              <script type="text/javascript">
                function setUser(user, nav) {
                  if (window.$s) {
                    window.$s.updateUser(user, nav);
                  } else {
                    setTimeout(function () {
                      setUser(user);
                    }, 500);
                  }
                }

                function onSignIn(googleUser) {
                  var profile = googleUser.getBasicProfile();
                  console.log('ID: ' + profile.getId()); // Do not send to your backend! Use an ID token instead.
                  jQuery('#status').text(
                    'Thanks for logging in with Google, ' + profile.getName() + '!'
                  );
                  setUser({
                    id: profile.getId(),
                    name: profile.getName(),
                    email: profile.getEmail(),
                    image: profile.getImageUrl()
                  });
                }
              </script>
              <a href="#" onclick="signOut()">Sign out of Google</a>
              <script type="text/javascript">
                function signOut() {
                  var auth2 = gapi.auth2.getAuthInstance();
                  auth2.signOut().then(function () {
                    console.log('User signed out of Google.');
                  });
                }
              </script>
            </div>
            <div class="col-sm-6">
              <h2>Facebook</h2>
              <script>
                function statusChangeCallback(response) {
                  console.log('statusChangeCallback');
                  console.log(response);
                  // The response object is returned with a status field that lets the
                  // app know the current login status of the person.
                  // Full docs on the response object can be found in the documentation
                  // for FB.getLoginStatus().
                  if (response.status === 'connected') {
                    // Logged into your app and Facebook.
                    testAPI();
                  } else if (response.status === 'not_authorized') {
                    // The person is logged into Facebook, but not your app.
                    document.getElementById('status').innerHTML = 'Please log ' + 'into this app.';
                  } else {
                    // The person is not logged into Facebook, so we're not sure if
                    // they are logged into this app or not.
                    document.getElementById('status').innerHTML = 'Please log ' + 'into Facebook.';
                  }
                }
                // This function is called when someone finishes with the Login
                // Button.  See the onlogin handler attached to it in the sample
                // code below.
                function checkLoginState() {
                  FB.getLoginStatus(function (response) {
                    statusChangeCallback(response);
                  });
                }
                // Here we run a very simple test of the Graph API after login is
                // successful.  See statusChangeCallback() for when this call is made.
                function testAPI() {
                  console.log('Welcome!  Fetching your information.... ');
                  FB.api('/me', function (response) {
                    setUser(response);
                    console.log('Successful login for: ' + response.name);
                    document.getElementById('status').innerHTML =
                      'Thanks for logging in with Facebook, ' + response.name + '!';
                  });
                }
              </script>
              <!--
      Below we include the Login Button social plugin. This button uses
      the JavaScript SDK to present a graphical Login button that triggers
      the FB.login() function when clicked.
    -->
              <fb:login-button scope="public_profile,email" onlogin="checkLoginState();">
              </fb:login-button>
              <div id="status"></div>
            </div>
          </div>
          <div class="row" ng-hide="user.id">
            <div class="col-sm-6">
              <h2>Login</h2>
              <form class="reg-login col-md-7" ng-submit="loginForm()">
                <div class="form-group">
                  <label for="login-username">Username</label>
                  <input
                    class="form-control"
                    id="login-username"
                    ng-model="login.username"
                    ng-change="loginError = false"
                  />
                </div>
                <div class="form-group">
                  <label for="login-password">Password</label>
                  <input
                    class="form-control"
                    id="login-password"
                    type="password"
                    ng-model="login.password"
                    ng-change="loginError = false"
                  />
                </div>
                <div class="alert alert-danger" ng-show="loginError">
                  Incorrect username and/or password.
                </div>
                <div class="form-group">
                  <label>
                    Remember me (30 days) <input type="checkbox" ng-model="login.remember" />
                  </label>
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
              </form>
            </div>
            <div class="col-sm-6">
              <h2>Create New Account</h2>
              <div class="reg-login col-md-7">
                <div class="form-group">
                  <label for="create-username">Username</label>
                  <input class="form-control" id="create-username" ng-model="newAccount.username" />
                </div>
                <div class="form-group">
                  <label for="create-password"
                    >Password <br /><small
                      >(no password recovery at this time,<br />so don't forget)</small
                    >
                  </label>
                  <input
                    class="form-control"
                    id="create-password"
                    type="password"
                    ng-model="newAccount.password"
                  />
                </div>
                <div class="btn btn-primary" ng-click="createNewAccount()">Create</div>
              </div>
            </div>
          </div>
          <div ng-show="user.name">Thank you for signing in as {{user.name}}.</div>
        </div>
      </div>
